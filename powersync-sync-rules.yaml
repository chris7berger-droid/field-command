# PowerSync Sync Rules for Field Command
# Currently deployed to Development instance via PowerSync Dashboard
#
# Single-tenant global buckets — no per-user filtering yet.
# TODO: Add crew-filtered buckets (admin_all + crew_assigned) once
# per-crew job filtering is implemented in the app.
#
# VIS-1: Legacy Sync Rules cannot JOIN/subquery in a data query
# (docs.powersync.com/sync/supported-sql — Sync Rules: "Not supported:
# subqueries, JOINs, CTEs"). Schedule-driven call_log rows use a second
# global bucket whose parameter query reads live Parked/Scheduled/Ongoing
# jobs. Complete-only jobs stay out (Go Back is a later slice). Do not
# pull the Sales-only historical book.

bucket_definitions:
  all_data:
    data:
      - >-
        SELECT * FROM call_log
        WHERE stage = 'Scheduled'
        OR stage = 'In Progress'
        OR stage = 'Parked'
        OR stage = 'mobilized'
        OR stage = 'in_progress'
      - SELECT * FROM proposal_wtc
      - SELECT * FROM job_wtcs
      - SELECT * FROM team_members
      - SELECT * FROM job_crew
      - SELECT job_id AS id, * FROM jobs
      - SELECT * FROM time_punches
      - SELECT * FROM daily_production_reports
      - SELECT * FROM daily_log_entries
      - SELECT * FROM job_material_checks
      - SELECT id, job_id, seq, label, start_date, end_date FROM job_mobilizations
      - SELECT id, job_id, crew_name, date, mobilization_id, team_member_id FROM assignments

  parked_scheduled_call_log:
    parameters: |
      SELECT call_log_id
        FROM jobs
       WHERE (deleted IS NULL OR deleted = 'No')
         AND (status = 'Parked' OR status = 'Scheduled' OR status = 'Ongoing')
         AND call_log_id IS NOT NULL
    data:
      - SELECT * FROM call_log WHERE id = bucket.call_log_id
